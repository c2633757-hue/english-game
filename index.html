<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inglese facile</title>
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Inglese facile">
<meta name="theme-color" content="#23473f">
<style>
:root{
  --bg:#f4f3ee; --card:#ffffff; --ink:#1d2a33; --soft:#5b6873; --line:#e2e2da;
  --green:#23473f; --green2:#2f5d52; --pale:#edf2ee; --yellow:#f7e8a6;
  --ok:#2d7a4f; --okbg:#e6f3ea; --no:#b2452f; --nobg:#fbeae5; --hint:#8a6a12; --hintbg:#fdf5d9;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
header.top{background:var(--green);color:#fff;padding:22px 20px 20px}
header.top .kick{letter-spacing:.14em;text-transform:uppercase;font-size:12.5px;font-weight:700;opacity:.8}
header.top h1{font-family:Georgia,"Times New Roman",serif;font-size:38px;line-height:1.1;margin:6px 0 6px}
header.top p{margin:0;opacity:.9}
.stats{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.12);border-radius:999px;padding:6px 14px;font-weight:600;font-size:15px}
main{max-width:640px;margin:0 auto;padding:16px 14px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;margin-bottom:14px}
.big{display:block;width:100%;text-align:left;background:var(--yellow);border:0;border-radius:18px;padding:18px 20px;margin-bottom:14px}
.big b{display:block;font-size:20px}
.big span{color:#5a4d14;font-size:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;text-align:left;min-height:104px}
.tile b{display:block;font-size:17px;margin-bottom:4px}
.tile span{color:var(--soft);font-size:14px;line-height:1.35;display:block}
.back{background:none;border:0;color:var(--green);font-weight:700;padding:4px 0;margin-bottom:8px}
h2{font-family:Georgia,"Times New Roman",serif;font-size:28px;line-height:1.15;margin:4px 0 12px}
h3{font-size:18px;margin:18px 0 8px}
.muted{color:var(--soft)}
.list button{display:flex;width:100%;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px;text-align:left}
.list .sub{display:block;color:var(--soft);font-size:14px}
.stars{color:#c99a12;font-size:15px;white-space:nowrap;margin-left:10px}
.tb{width:100%;border-collapse:collapse;margin:10px 0 6px;font-size:16px}
.tb th,.tb td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
.tb th{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--soft)}
.box{background:var(--pale);border-radius:16px;padding:14px 16px;margin:12px 0}
.box.warn{background:var(--hintbg)}
.box .lab{font-weight:700;color:var(--green);display:block;margin-bottom:4px}
.box.warn .lab{color:var(--hint)}
.ex{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.ex:last-child{border-bottom:0}
.ex .it{display:block;color:var(--soft);font-size:14.5px}
.say{flex:none;background:var(--pale);border:1px solid #d3ddd6;border-radius:12px;padding:6px 12px;font-weight:700;color:var(--green);font-size:14.5px}
body.novoice .say{display:none!important}
.btn{background:var(--green);color:#fff;border:0;border-radius:14px;padding:13px 20px;font-weight:700}
.btn.ghost{background:#fff;color:var(--green);border:1px solid #c9d5cd}
.btn.wide{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.prog{height:8px;background:#e3e3dc;border-radius:99px;overflow:hidden;margin:6px 0 14px}
.prog i{display:block;height:100%;background:var(--green2);border-radius:99px;transition:width .3s}
.qtop{display:flex;justify-content:space-between;color:var(--soft);font-size:14px;font-weight:600}
.ask{color:var(--soft);font-size:15px;margin:6px 0 4px}
.q{font-size:22px;line-height:1.45;margin:6px 0 16px}
.gap{display:inline-block;min-width:70px;border-bottom:3px solid var(--green2);margin:0 4px;color:var(--green2);font-weight:700;text-align:center}
.opts{display:grid;gap:10px}
.opt{background:#fff;border:2px solid var(--line);border-radius:14px;padding:13px 16px;text-align:left;font-size:18px;font-weight:600}
.opt:disabled{opacity:.45}
.opt.right{border-color:var(--ok);background:var(--okbg);opacity:1}
.opt.wrong{border-color:var(--no);background:var(--nobg)}
input.ans{width:100%;font-size:20px;padding:13px 14px;border:2px solid #c9d1cb;border-radius:14px;background:#fff;outline:none}
input.ans:focus{border-color:var(--green2)}
.fb{border-radius:16px;padding:13px 16px;margin-top:14px;font-size:16px}
.fb.ok{background:var(--okbg);color:#1f5a39}
.fb.no{background:var(--nobg);color:#7d2f1f}
.fb.hint{background:var(--hintbg);color:#6b520c}
.fb.info{background:var(--pale);color:var(--green)}
.fb b{display:block;margin-bottom:2px}
.link{background:none;border:0;color:var(--green);text-decoration:underline;padding:0;font-weight:600;font-size:15px}
.tries{display:flex;gap:6px;margin-top:10px}
.tries i{width:12px;height:12px;border-radius:50%;background:#dcdcd4}
.tries i.used{background:#d99a87}
.res{padding:10px 0;border-bottom:1px solid var(--line);font-size:15.5px}
.res:last-child{border-bottom:0}
.score{font-family:Georgia,serif;font-size:56px;line-height:1;color:var(--green);margin:6px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{border:1px solid #c9d5cd;background:#fff;border-radius:999px;padding:7px 13px;font-size:14.5px;font-weight:600}
.chip.on{background:var(--green);color:#fff;border-color:var(--green)}
.song .ttl{font-family:Georgia,serif;font-size:26px;line-height:1.3;margin:8px 0 4px}
.song .by{color:var(--soft);margin-bottom:14px}
.yt{display:inline-block;margin-top:8px;color:var(--green);font-weight:700}
.sheet{position:fixed;inset:0;background:rgba(20,30,28,.45);display:flex;align-items:flex-end;z-index:20}
.sheet .in{background:var(--bg);width:100%;max-height:86vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px 40px}
.sheet .in .close{position:sticky;top:0;float:right}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.sw{width:52px;height:30px;border-radius:99px;background:#cfd3cc;border:0;position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
.sw.on{background:var(--green2)}
.sw.on::after{left:25px}
.dlg{background:var(--pale);border-radius:14px;padding:10px 14px;margin:6px 0 12px;font-size:17px;line-height:1.5}
.dlg div{padding:3px 0}
.built{min-height:56px;border:2px dashed #c9d1cb;border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.tiles{display:flex;flex-wrap:wrap;gap:8px}
.tw{background:#fff;border:2px solid var(--line);border-radius:12px;padding:9px 13px;font-size:17px;font-weight:600}
.tw.on{background:var(--okbg);border-color:#bcd9c6}
.tw:disabled{opacity:.3}
.bar{height:8px;background:#e3e3dc;border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--green2)}
.big.comp{background:var(--green);color:#fff}
.big.comp span{color:#d9e6df}
.cd{font-family:Georgia,serif;font-size:44px;line-height:1;color:var(--green)}
.exb{background:#f6f3e4;border-radius:12px;padding:9px 13px;margin:6px 0 10px;font-size:15.5px;color:#4a4528}
.exb .lab{display:block;font-weight:700;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:#8a6a12}
.exb .exa{color:var(--ok);font-weight:700}
.gapx{display:inline-block;min-width:34px;border-bottom:2px solid #b9ab6a;text-align:center}
.wpop{position:fixed;left:12px;right:12px;bottom:16px;z-index:50;background:#1d2a33;color:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 8px 30px rgba(0,0,0,.25);display:flex;gap:10px;align-items:center;font-size:16px}
.wpop b{font-size:18px}.wpop .say{background:#2f5d52;color:#fff;border-color:#2f5d52}
.dfl{display:flex;gap:8px;align-items:flex-start;padding:5px 0;font-size:16.5px}
.dfl .sp{flex:none;font-weight:800;color:var(--green);min-width:22px}
.slot{flex:1;text-align:left;background:#fff;border:2px dashed #c9d1cb;border-radius:12px;padding:8px 10px;font-size:16px;min-height:42px}
.slot.sel{border-color:var(--green2);border-style:solid;background:var(--okbg)}
.slot.full{border-style:solid}
.slot.right{border-color:var(--ok);background:var(--okbg)}.slot.wrong{border-color:var(--no);background:var(--nobg)}
.bank{display:grid;gap:8px;margin-top:12px}.bank button{text-align:left;background:var(--pale);border:1px solid #d3ddd6;border-radius:12px;padding:10px 12px;font-size:16px}
.bank button:disabled{opacity:.3}
.lock{max-width:460px;margin:40px auto;text-align:center}.lock .code{font-family:Georgia,serif;font-size:40px;letter-spacing:.12em;color:var(--green);margin:8px 0}
small{font-size:13.5px}
</style>
</head>
<body class="novoice">
<header class="top" id="hdr"></header>
<main id="app"></main>
<div id="sheet"></div>
<div class="wpop" id="wpop" style="display:none"></div>

<script>
/* =========================================================
   CONTENUTI
   q: frase ("___" = spazio da completare)
   m: opzioni a scelta (a = indice giusto)  |  w: risposte accettate
   h: aiutino   y: perché
   ========================================================= */
const TOPICS = [
{
 id:"pron", t:"Pronomi personali", s:"I, you, he… e me, him, her…",
 ask:"Completa con il pronome giusto.",
 rule:`<p>In inglese il <b>soggetto si scrive sempre</b>. In italiano dici «è simpatica», in inglese devi dire chi: <b>She</b> is nice.</p>
 <table class="tb"><tr><th>Italiano</th><th>Soggetto</th><th>Complemento</th></tr>
 <tr><td>io</td><td><b>I</b></td><td>me</td></tr>
 <tr><td>tu</td><td><b>you</b></td><td>you</td></tr>
 <tr><td>lui</td><td><b>he</b></td><td>him</td></tr>
 <tr><td>lei</td><td><b>she</b></td><td>her</td></tr>
 <tr><td>cosa o animale</td><td><b>it</b></td><td>it</td></tr>
 <tr><td>noi</td><td><b>we</b></td><td>us</td></tr>
 <tr><td>voi</td><td><b>you</b></td><td>you</td></tr>
 <tr><td>loro</td><td><b>they</b></td><td>them</td></tr></table>
 <p><b>Soggetto</b>: prima del verbo, è chi fa l'azione. <b>Complemento</b>: dopo il verbo o dopo parole come <i>for, with, at</i>.</p>
 <p><b>I</b> (io) si scrive sempre maiuscolo.</p>`,
 ex:[["She is my friend.","Lei è mia amica."],["I like him.","Lui mi piace."],["It's cold.","Fa freddo."],["Look at them!","Guardali!"]],
 trap:"Per il tempo e l'ora serve sempre it: «È tardi» = It's late. «Is late» da solo è sbagliato.",
 pr:[["he","«hii», con la h soffiata"],["she","«scii»"],["they","«dhei»: punta della lingua tra i denti"],["them","«dhem»"],["you","«iù»"]],
 qs:[
  {q:"___ is my brother. His name is Luca.",m:["He","Him","His"],a:0,h:"Prima del verbo serve il soggetto.",y:"Prima del verbo (is) va il soggetto. Luca è maschio → He."},
  {q:"Look at ___! She's so funny.",m:["she","her","he"],a:1,h:"Dopo «look at» serve il complemento.",y:"Dopo look at serve il complemento: lei → her."},
  {q:"My dog is very old. ___ is twelve.",w:["it"],h:"Per animali e cose c'è un pronome tutto suo.",y:"Il cane è un animale → it."},
  {q:"Can you help ___? (noi)",w:["us"],h:"Dopo il verbo serve il complemento di «noi».",y:"Noi come complemento = us."},
  {q:"Marco and I are friends. ___ are in the same class.",w:["we"],h:"Marco e io = noi.",y:"Marco and I = noi, soggetto → we."},
  {q:"I love ___. (loro)",m:["they","them","their"],a:1,h:"Dopo il verbo serve il complemento.",y:"Dopo love serve il complemento di loro → them."},
  {q:"Where are Anna and Sara? I can't see ___.",w:["them"],h:"Anna e Sara = loro. Dopo «see» serve il complemento.",y:"Loro come complemento = them."},
  {q:"___ is cold today.",m:["It","Is","He"],a:0,h:"In inglese il soggetto c'è sempre, anche quando parli del tempo.",y:"Per il tempo si usa it: It is cold."},
  {q:"This present is for ___. (te)",w:["you"],h:"Tu e te in inglese sono la stessa parola.",y:"You va bene sia come soggetto sia come complemento."},
  {q:"Paul is nice. I like ___.",m:["he","him","his"],a:1,h:"Dopo «like» serve il complemento.",y:"Dopo like serve il complemento: lui → him."},
  {q:"___ am fifteen. (io)",w:["I"],h:"È la parola più corta dell'inglese.",y:"Io = I, sempre maiuscolo."},
  {q:"Sara and Tom? ___ are at school.",m:["They","Them","We"],a:0,h:"Sara e Tom = loro, prima del verbo.",y:"Soggetto di loro → They."}
 ]
},
{
 id:"be", t:"Verbo to be (essere)", s:"am, is, are",
 ask:"Completa con la forma giusta di to be.",
 rule:`<p><b>To be</b> = essere. Al presente ha tre forme: <b>am</b>, <b>is</b>, <b>are</b>.</p>
 <table class="tb"><tr><th>Affermativa</th><th>Breve</th><th>Negativa</th><th>Domanda</th></tr>
 <tr><td>I am</td><td>I'm</td><td>I'm not</td><td>Am I?</td></tr>
 <tr><td>you are</td><td>you're</td><td>you aren't</td><td>Are you?</td></tr>
 <tr><td>he / she / it is</td><td>he's</td><td>he isn't</td><td>Is he?</td></tr>
 <tr><td>we are</td><td>we're</td><td>we aren't</td><td>Are we?</td></tr>
 <tr><td>they are</td><td>they're</td><td>they aren't</td><td>Are they?</td></tr></table>
 <div class="box"><span class="lab">Trucco per non sbagliare</span><b>am</b> solo con I. <b>is</b> con he, she, it e con una persona o una cosa sola (Tom is, the cat is). <b>are</b> con tutto il resto.</div>
 <p><b>Domanda</b>: il verbo va prima del soggetto. You are → <b>Are you</b>…?</p>
 <p><b>Risposte brevi</b>: Yes, I am. / No, I'm not. — Yes, she is. / No, she isn't.</p>`,
 ex:[["I'm fourteen.","Ho quattordici anni."],["She isn't at home.","Lei non è a casa."],["Are you Italian? Yes, I am.","Sei italiana? Sì."],["They're my cousins.","Sono i miei cugini."]],
 trap:"Nella risposta breve col sì niente forma corta: «Yes, I am», mai «Yes, I'm».",
 pr:[["am","«em»"],["are","«aa»: la r quasi non si sente"],["is","«iz», la s vibra come una zanzara"],["I'm","«aim»"],["they're","«dhea»"],["isn't","«iznt»"],["aren't","«aant»"]],
 qs:[
  {q:"I ___ fourteen.",m:["am","is","are"],a:0,h:"Con I c'è una forma sola.",y:"Con I si usa sempre am."},
  {q:"My parents ___ at home.",m:["is","are","am"],a:1,h:"Parents sono più persone.",y:"My parents = they → are."},
  {q:"She ___ my best friend.",w:["is","'s"],h:"She = una persona sola.",y:"Con he, she, it si usa is."},
  {q:"We ___ tired. (negativo)",w:["aren't","are not","'re not"],h:"Prendi la forma di «we» e aggiungi la negazione.",y:"We are + not = we aren't."},
  {q:"___ you from Naples?",w:["are"],h:"Nelle domande il verbo va prima del soggetto.",y:"Domanda con you: Are you…?"},
  {q:"Is Tom your brother? — Yes, he ___.",m:["is","'s","isn't"],a:0,h:"Col sì, niente forma corta.",y:"Risposta breve col sì: Yes, he is."},
  {q:"Is it cold? — No, it ___.",w:["isn't","is not","'s not"],h:"Risposta breve col no.",y:"No, it isn't."},
  {q:"The cat ___ under the table.",m:["is","are","am"],a:0,h:"Un gatto solo = it.",y:"The cat = it → is."},
  {q:"___ not hungry. (io, forma breve)",w:["I'm"],h:"I + am attaccati con l'apostrofo.",y:"I am = I'm."},
  {q:"___ your friends nice?",m:["Is","Are","Am"],a:1,h:"Friends sono più persone.",y:"Your friends = they → Are."},
  {q:"Where ___ my keys?",w:["are"],h:"Keys finisce in -s: sono più chiavi.",y:"Keys è plurale → are."},
  {q:"Laura and I ___ in the same class.",m:["are","is","am"],a:0,h:"Laura e io = noi.",y:"Laura and I = we → are."}
 ]
},
{
 id:"art", t:"Articoli a, an, the", s:"un, uno, una, il, la…",
 ask:"Scegli o scrivi l'articolo giusto.",
 rule:`<p><b>a / an</b> = un, uno, una. Si usano solo con una cosa sola.</p>
 <table class="tb"><tr><th>Quando</th><th>Esempi</th></tr>
 <tr><td><b>a</b> + suono di consonante</td><td>a book, a dog, a university</td></tr>
 <tr><td><b>an</b> + suono di vocale</td><td>an apple, an egg, an hour</td></tr></table>
 <div class="box"><span class="lab">Trucco</span>Decide il suono iniziale. <i>University</i> si legge «iuniversiti» → <b>a</b> university. <i>Hour</i> si legge «aua», la h è muta → <b>an</b> hour.</div>
 <p><b>the</b> = il, lo, la, i, gli, le. È uguale per maschile, femminile, singolare e plurale.</p>
 <p>Con i <b>mestieri</b> metti sempre a/an: Lei è medico = She's <b>a</b> doctor.</p>`,
 ex:[["I've got a cat and an old bike.","Ho un gatto e una bici vecchia."],["The sun is hot.","Il sole è caldo."],["My mum is a teacher.","Mia mamma è insegnante."]],
 trap:"In italiano dici «è medico», in inglese serve l'articolo: He's a doctor.",
 pr:[["a","una «e» leggerissima"],["an","«en»"],["the book","davanti a consonante «dhe»"],["the apple","davanti a vocale «dhi»"]],
 qs:[
  {q:"I've got ___ orange.",m:["a","an"],a:1,h:"Orange comincia con una vocale.",y:"Suono di vocale → an orange."},
  {q:"She's got ___ cat.",m:["a","an"],a:0,h:"Cat comincia con una consonante.",y:"Suono di consonante → a cat."},
  {q:"It's ___ umbrella.",m:["a","an"],a:1,h:"Umbrella comincia con la u, che qui si legge «a».",y:"Suono di vocale → an umbrella."},
  {q:"He's ___ university student.",m:["a","an"],a:0,h:"Come si legge university all'inizio?",y:"University si legge «iuniversiti»: suono di consonante → a."},
  {q:"It's ___ hour from Naples.",m:["a","an"],a:1,h:"In hour la h non si legge.",y:"Hour si legge «aua»: suono di vocale → an."},
  {q:"My mum is ___ teacher.",w:["a"],h:"Con i mestieri serve l'articolo un/una.",y:"Mestiere → a teacher."},
  {q:"Can you close ___ door, please? (la porta)",w:["the"],h:"La porta: articolo determinativo.",y:"Il, la, lo… = the."},
  {q:"___ sun is hot today.",m:["A","The","An"],a:1,h:"Di sole ce n'è uno solo.",y:"Una cosa unica e conosciuta → the."},
  {q:"He's got ___ old bike.",w:["an"],h:"Guarda la parola subito dopo lo spazio: old.",y:"Old comincia con un suono di vocale → an."},
  {q:"She's ___ actress.",m:["a","an"],a:1,h:"Actress comincia con una vocale.",y:"Suono di vocale → an actress."},
  {q:"There's ___ apple on the table.",w:["an"],h:"Apple comincia con una vocale.",y:"Suono di vocale → an apple."},
  {q:"My dad is ___ engineer.",m:["a","an"],a:1,h:"Engineer comincia con una vocale.",y:"Mestiere con suono di vocale → an engineer."}
 ]
},
{
 id:"plur", t:"Il plurale", s:"books, boxes, babies, children…",
 ask:"Scrivi il plurale.",
 rule:`<p>Di solito aggiungi <b>-s</b>: book → book<b>s</b>.</p>
 <table class="tb"><tr><th>Se la parola finisce con</th><th>Fai così</th></tr>
 <tr><td>s, ss, sh, ch, x, o</td><td><b>-es</b>: bus → buses, box → boxes, watch → watches, tomato → tomatoes</td></tr>
 <tr><td>consonante + y</td><td><b>-ies</b>: baby → babies, city → cities</td></tr>
 <tr><td>vocale + y</td><td>solo <b>-s</b>: boy → boys, day → days</td></tr>
 <tr><td>f / fe</td><td><b>-ves</b>: knife → knives, leaf → leaves</td></tr></table>
 <div class="box"><span class="lab">Irregolari da imparare a memoria</span>man → men · woman → women · child → children · person → people · foot → feet · tooth → teeth · mouse → mice · fish → fish · sheep → sheep</div>
 <div class="box"><span class="lab">I cognomi delle famiglie</span><b>the</b> + cognome + <b>s</b>: the Smiths = la famiglia Smith, the Rossis = la famiglia Rossi.</div>
 <h3>Nomi che cambiano numero</h3>

{

{

 rule:`<div class="box"><span class="lab">Regola 1</span>L'aggettivo va <b>prima del nome</b>: una macchina rossa = a <b>red car</b>.</div>

 <p>Dopo il verbo essere resta uguale: The cars are <b>red</b>.</p>
 <h3>I colori</h3><p>red rosso · blue blu, azzurro · green verde · yellow giallo · orange arancione · pink rosa · purple viola · brown marrone · black nero · white bianco · grey grigio</p>
 <h3>Le forme</h3><p>round rotondo · square quadrato · triangular triangolare · rectangular rettangolare · oval ovale</p>
 <h3>Il tempo atmosferico</h3><p>Si comincia sempre con <b>It's</b>: It's sunny (c'è il sole) · It's cloudy (è nuvoloso) · It's rainy (è piovoso) · It's windy (c'è vento) · It's foggy (c'è nebbia) · It's snowy (nevoso) · It's hot / warm / cold (fa caldo / fa tiepido / fa freddo)</p>`,

 qs:[
  {q:"Ho una macchina rossa = I've got ___.",m:["a red car","a car red","a reds car"],a:0,h:"L'aggettivo va prima del nome.",y:"Aggettivo + nome: a red car."},

  {q:"My shoes are ___. (nere)",w:["black"],h:"Il colore del nero.",y:"Nero = black, uguale anche al plurale."},
  {q:"She's got ___ eyes. (azzurri)",m:["blue","blues"],a:0,h:"L'aggettivo non prende la -s.",y:"Blue resta uguale anche con eyes."},
  {q:"A football is ___. (rotondo)",w:["round"],h:"La forma del cerchio.",y:"Rotondo = round."},
  {q:"This table is ___. (quadrato)",w:["square"],h:"Quattro lati uguali.",y:"Quadrato = square."},

  {q:"È nuvoloso = It's ___.",w:["cloudy"],h:"Cloud = nuvola.",y:"Nuvoloso → cloudy."},

  {q:"Il cielo è grigio = The sky is ___.",w:["grey","gray"],h:"Il colore delle nuvole di pioggia.",y:"Grigio = grey."},
  {q:"They are ___ girls. (simpatiche)",m:["nice","nices"],a:0,h:"L'aggettivo non cambia mai.",y:"Nice resta uguale anche al plurale."},
  {q:"Fa freddo = It's ___.",w:["cold"],h:"Il contrario di hot.",y:"Fa freddo → It's cold."}
 ]
},
{

 ask:"Completa la domanda.",
 rule:`<table class="tb"><tr><th>Inglese</th><th>Italiano</th></tr>
 <tr><td><b>Who</b></td><td>chi</td></tr><tr><td><b>What</b></td><td>che cosa, quale</td></tr>
 <tr><td><b>Where</b></td><td>dove</td></tr><tr><td><b>When</b></td><td>quando</td></tr>
 <tr><td><b>How</b></td><td>come</td></tr><tr><td><b>How old</b></td><td>quanti anni</td></tr>
 <tr><td><b>What colour</b></td><td>di che colore</td></tr><tr><td><b>What shape</b></td><td>di che forma</td></tr>
 <tr><td><b>What nationality</b></td><td>di che nazionalità</td></tr></table>
 <p>Dopo la parola della domanda viene il verbo e poi il soggetto: Where <b>are you</b>…? How old <b>is she</b>?</p>
 <div class="box"><span class="lab">Domande che si traducono in modo diverso</span>
 Com'è? = What <b>is</b> it <b>like</b>? (Com'è la tua scuola? = What's your school like?)<br>
 Di dove sei? = Where <b>are</b> you <b>from</b>?<br>
 Da dove viene lui? = Where <b>is</b> he <b>from</b>?<br>
 Quanti anni hai? = How old <b>are</b> you?<br>
 Come ti chiami? = What's your name?<br>
 Che tempo fa? = What's the weather like?</div>`,
 ex:[["Where are you from? I'm from Naples.","Di dove sei? Sono di Napoli."],["How old is your brother?","Quanti anni ha tuo fratello?"],["What's your school like?","Com'è la tua scuola?"],["What colour is your bag?","Di che colore è la tua borsa?"]],
 trap:"«Com'è?» non si traduce con how. Si dice What's it like?",
 pr:[["who","«huu»"],["what","«uot»"],["where","«uea»"],["when","«uen»"],["how","«hau»"]],
 qs:[
  {q:"___ is your name?",w:["what"],h:"Come ti chiami: in inglese si chiede «che cosa è il tuo nome».",y:"What's your name?"},
  {q:"___ are you from?",w:["where"],h:"Di dove sei: è una domanda sul posto.",y:"Where are you from?"},

  {q:"___ is your birthday?",w:["when"],h:"È una domanda sul giorno.",y:"Quando → When."},
  {q:"___ is that boy? — He's my brother.",m:["Who","What","Where"],a:0,h:"Chiedi di una persona.",y:"Chi → Who."},
  {q:"___ are you? — I'm fine, thanks.",m:["How","Who","What"],a:0,h:"Come stai?",y:"Come stai? = How are you?"},
  {q:"___ colour is your bag?",w:["what"],h:"Di che colore = ___ colour.",y:"What colour…?"},
  {q:"Com'è la tua scuola? = What ___ your school like?",w:["is","'s"],h:"Ci vuole il verbo essere.",y:"What is your school like?"},
  {q:"Di dove sei? = Where are you ___?",w:["from"],h:"La parola per «da, provenienza».",y:"Where are you from?"},
  {q:"___ shape is it? — It's round.",m:["What","How","Who"],a:0,h:"Di che forma = ___ shape.",y:"What shape…?"},
  {q:"___ nationality is she? — She's French.",m:["What","Where","How"],a:0,h:"Di che nazionalità = ___ nationality.",y:"What nationality…?"},
  {q:"Che tempo fa? = What's the weather ___?",w:["like"],h:"È la stessa parola di «Com'è?».",y:"What's the weather like?"},

 ]
},
{
 id:"poss", t:"Possessivi e 's", s:"my, your, his, her… e Tom's",
 ask:"Completa con il possessivo giusto.",
 rule:`<table class="tb"><tr><th>Chi possiede</th><th>Possessivo</th></tr>
 <tr><td>I</td><td><b>my</b> (mio)</td></tr><tr><td>you</td><td><b>your</b> (tuo / vostro)</td></tr>
 <tr><td>he</td><td><b>his</b> (di lui)</td></tr><tr><td>she</td><td><b>her</b> (di lei)</td></tr>
 <tr><td>it</td><td><b>its</b> (di cosa o animale)</td></tr><tr><td>we</td><td><b>our</b> (nostro)</td></tr>
 <tr><td>they</td><td><b>their</b> (loro)</td></tr></table>
 <p>Va prima del nome e <b>senza articolo</b>: my book (mai «the my book»).</p>
 <div class="box"><span class="lab">His o her? Il trucco</span>In italiano «suo» e «sua» cambiano in base alla cosa: il suo libro, la sua borsa. In inglese guardi solo <b>la persona che possiede</b>. Fatti la domanda: <b>di chi è?</b> Di un maschio → <b>his</b>. Di una femmina → <b>her</b>.<br>Il libro di Marco = his book · la borsa di Marco = his bag<br>Il libro di Anna = her book · la borsa di Anna = her bag</div>
 <p><b>Genitivo sassone</b> (di qualcuno): chi possiede + <b>'s</b> + cosa. La bici di Tom = <b>Tom's</b> bike. La borsa di Mary = <b>Mary's</b> bag. La camera di mia sorella = my <b>sister's</b> room. Se finisce già in -s basta l'apostrofo: my parents<b>'</b> car.</p>`,
 ex:[["This is Marco and his sister.","Questo è Marco e sua sorella."],["Anna loves her dog.","Anna ama il suo cane."],["Tom's bike is red.","La bici di Tom è rossa."],["Their house is big.","La loro casa è grande."]],
 trap:"its (di esso) e it's (= it is) sono diversi. their, there e they're si pronunciano uguale ma si scrivono diversi.",
 pr:[["my","«mai»"],["your","«ior»"],["his","«hiz», h soffiata"],["her","«hö», vocale chiusa e corta"],["our","«aua»"],["their","«dhea», uguale a there"]],
 qs:[

  {q:"Anna loves ___ dog.",m:["his","her","their"],a:1,h:"Il cane è di Anna, cioè di lei.",y:"Di lei → her."},
  {q:"We've got a new car. ___ car is red.",w:["our"],h:"La macchina è di noi.",y:"We → our."},
  {q:"They live in Rome. ___ house is big.",w:["their"],h:"La casa è di loro.",y:"They → their."},
  {q:"The dog is in ___ bed.",m:["its","it's"],a:0,h:"It's vuol dire «it is».",y:"Di esso (il cane) → its, senza apostrofo."},
  {q:"I've got a sister. ___ name is Giulia.",w:["her"],h:"Il nome è della sorella, cioè di lei.",y:"Di lei → her."},
  {q:"La bici di Tom = ___ bike",w:["tom's"],h:"Chi possiede + apostrofo + s.",y:"Genitivo sassone: Tom's bike."},
  {q:"La macchina dei miei genitori = my ___ car",m:["parent's","parents'","parents"],a:1,h:"Parents finisce già in -s.",y:"Parola plurale in -s → solo apostrofo: parents'."},
  {q:"Is this ___ pen? (tua)",w:["your"],h:"Tuo / tua.",y:"You → your."},
  {q:"I like ___ shoes. (le mie)",m:["my","me","I"],a:0,h:"Prima di un nome.",y:"Mio, mie → my."},
  {q:"La casa di Sara = ___ house",w:["sara's"],h:"Chi possiede + apostrofo + s.",y:"Genitivo sassone: Sara's house."},
  {q:"Mr Rossi is ___ teacher. (nostro)",m:["our","us","we"],a:0,h:"Prima di un nome serve il possessivo.",y:"Nostro → our."},
  {q:"Marco e la sua borsa = Marco and ___ bag",m:["his","her"],a:0,h:"Di chi è la borsa? Di Marco.",y:"La borsa è di un maschio → his. La parola «borsa» non conta."},
  {q:"Sara e il suo libro = Sara and ___ book",m:["his","her"],a:1,h:"Di chi è il libro? Di Sara.",y:"Il libro è di una femmina → her."},
  {q:"La camera di mia sorella = my ___ room",w:["sister's"],h:"Chi possiede + apostrofo + s.",y:"Genitivo sassone: my sister's room."},
  {q:"My dad loves ___ car.",w:["his"],h:"Di chi è la macchina?",y:"La macchina è del papà → his."},
{q:"They call me Bob, but ___ full name is Robert.",m:["my","their","his"],a:0,h:"Chi parla? Io.",y:"Me → il mio nome → my."},
  {q:"Mr and Mrs Campbell are Scottish, but ___ home is in England.",m:["their","its","our"],a:0,h:"Due persone = loro.",y:"Di loro → their."},
  {q:"Is that your new science teacher? Yes, ___ name's George Parker.",m:["his","its","her"],a:0,h:"George è un maschio.",y:"Di lui → his."},
  {q:"The boy with Pamela is ___ boyfriend.",m:["her","his","its"],a:0,h:"Di chi è il ragazzo? Di Pamela.",y:"Di lei → her."},
  {q:"The car key isn't in ___ usual place.",m:["its","her","his"],a:0,h:"Il posto è della chiave: una cosa.",y:"Di una cosa → its."},
  {q:"Giulia and Francesca are Italian, but ___ mother is Australian.",m:["their","our","her"],a:0,h:"Due ragazze = loro.",y:"Di loro → their."},
  {q:"Madonna is a famous singer. ___ real name is Louise Ciccone.",w:["her"],h:"Madonna è una donna.",y:"Di lei → her."},
  {q:"I'm a student. ___ college is near my house.",w:["my"],h:"Io.",y:"Il mio → my."},
  {q:"Microsoft is a big company. ___ head office is in Seattle.",w:["its"],h:"Microsoft è una cosa, non una persona.",y:"Di una cosa → its."},
  {q:"You are very clever students. ___ tests are excellent.",w:["your"],h:"Voi.",y:"Vostri → your."},
  {q:"A: Is Peter a fisherman? B: No, ___ isn't.",w:["he"],h:"Peter = lui, soggetto.",y:"Soggetto → he."},
  {q:"A: Who are those people? B: ___'re my parents.",w:["they"],h:"Più persone, soggetto.",y:"They're my parents."},

 ]
},
{

 <p>Risposte brevi: Yes, there is. / No, there isn't. — Yes, there are. / No, there aren't.</p>
 <div class="box"><span class="lab">Some o any?</span>Al plurale: <b>some</b> nelle frasi affermative (There are some books). <b>any</b> nelle negative e nelle domande (There aren't any books. Are there any books?).</div>`,

  {q:"___ a park near my house.",m:["There is","There are"],a:0,h:"Un parco = una cosa sola.",y:"Una cosa → There is."},

  {q:"Are there ___ eggs in the fridge?",m:["some","any"],a:1,h:"È una domanda.",y:"Domanda → any."},
  {q:"___ there any chairs in the kitchen?",w:["are"],h:"Chairs è plurale.",y:"Domanda al plurale → Are there…?"},
  {q:"Is there a garden? — No, there ___.",m:["isn't","aren't","not"],a:0,h:"Un giardino solo.",y:"No, there isn't."}
 ]

{
 id:"have", t:"Have got (avere)", s:"have got, has got",
 ask:"Completa con la forma giusta di have got.",
 rule:`<p><b>Have got</b> = avere, possedere. Si usa per cose che hai, famiglia, aspetto fisico, malattie.</p>
 <table class="tb"><tr><th></th><th>I / you / we / they</th><th>he / she / it</th></tr>
 <tr><td>+</td><td>have got ('ve got)</td><td><b>has</b> got ('s got)</td></tr>
 <tr><td>−</td><td>haven't got</td><td><b>hasn't</b> got</td></tr>
 <tr><td>?</td><td>Have you got…?</td><td><b>Has</b> she got…?</td></tr></table>
 <p><b>Domanda</b>: have/has va prima del soggetto, <b>got dopo</b>: Has Paul got a car?</p>
 <p><b>Risposte brevi</b> (senza got!): Yes, I have. / No, I haven't. — Yes, she has. / No, she hasn't.</p>
 <div class="box"><span class="lab">Trucco</span>Lui, lei, esso → <b>has</b>. Tutti gli altri → <b>have</b>. Come is e are per to be.</div>`,
 ex:[["I've got a brother.","Ho un fratello."],["She's got green eyes.","Lei ha gli occhi verdi."],["Have you got a pen? Yes, I have.","Hai una penna? Sì."],["He hasn't got a car.","Lui non ha la macchina."]],
 trap:"Nella risposta breve niente got: «Yes, I have», mai «Yes, I have got».",
 pr:[["have","«hev», a aperta quasi come una e"],["has","«hez»"],["got","«got», o aperta e corta"],["I've got","«aiv got»"],["haven't","«hévnt»"],["hasn't","«héznt»"]],

  {q:"___ you got a pen?",w:["have"],h:"Nella domanda il verbo va prima del soggetto.",y:"Domanda con you: Have you got…?"},

  {q:"___ your brother got a phone?",m:["Have","Has"],a:1,h:"Your brother = he.",y:"He → Has… got?"},
  {q:"Have you got a bike? — Yes, I ___.",m:["have","have got","'ve"],a:0,h:"Nella risposta breve got non c'è.",y:"Yes, I have."},
  {q:"We ___ got any homework today. (negativo)",w:["haven't","have not"],h:"We, frase negativa.",y:"We → haven't got."},
  {q:"The house ___ got three bedrooms.",m:["have","has"],a:1,h:"The house = it.",y:"It → has got."},
  {q:"What ___ Paul got in his bag?",w:["has"],h:"Paul = he.",y:"He → What has Paul got?"},
  {q:"Phone me this evening. You ___ got my number.",w:["have","'ve"],h:"Soggetto you.",y:"You → have got."}
 ]
},
{
 id:"s", t:"'s vuol dire is o has?", s:"She's tall / She's got",
 ask:"Che cosa significa 's in questa frase?",
 rule:`<p>La <b>'s</b> attaccata a una parola può avere tre significati.</p>
 <table class="tb"><tr><th>Se dopo c'è…</th><th>'s =</th><th>Esempio</th></tr>
 <tr><td><b>got</b></td><td><b>has</b></td><td>She's got a cat = She has got</td></tr>
 <tr><td>un aggettivo, un luogo, a/an…</td><td><b>is</b></td><td>She's tall = She is tall</td></tr>
 <tr><td>la cosa che appartiene</td><td><b>di</b></td><td>Anna's bag = la borsa di Anna</td></tr></table>
 <div class="box"><span class="lab">Trucco veloce</span>Cerca <b>got</b> subito dopo. Se c'è → has. Se manca → quasi sempre is.</div>`,
 ex:[["He's got a new job.","Lui ha un lavoro nuovo."],["He's at school.","Lui è a scuola."],["Anna's bag is red.","La borsa di Anna è rossa."]],

  {q:"It's quite cold today.",m:["is","has","di (possesso)"],a:0,h:"C'è got dopo?",y:"Niente got, dopo c'è un aggettivo → is."},
  {q:"Martha's afraid of spiders.",m:["is","has","di (possesso)"],a:0,h:"C'è got dopo?",y:"Afraid è un aggettivo → is."},

  {q:"She's a doctor.",m:["is","has","di (possesso)"],a:0,h:"C'è got dopo?",y:"Lei è un medico → is."},
  {q:"My dad's got a beard.",m:["is","has","di (possesso)"],a:1,h:"Guarda la parola dopo 's.",y:"Dopo c'è got → has."},
  {q:"Tom's in the garden.",m:["is","has","di (possesso)"],a:0,h:"Dice dove si trova Tom.",y:"Tom è in giardino → is."},
  {q:"There's a cat on the sofa.",m:["is","has","di (possesso)"],a:0,h:"There's = c'è.",y:"There's = there is."},
  {q:"It's got four legs.",m:["is","has","di (possesso)"],a:1,h:"Guarda la parola dopo 's.",y:"Dopo c'è got → has."},
  {q:"Anna's bag is red.",m:["is","has","di (possesso)"],a:2,h:"Dopo 's c'è una cosa: di chi è?",y:"La borsa di Anna → genitivo sassone."},
  {q:"Who's got my pen?",m:["is","has","di (possesso)"],a:1,h:"Guarda la parola dopo 's.",y:"Dopo c'è got → has."},
  {q:"What's your name?",m:["is","has","di (possesso)"],a:0,h:"Come si chiede il nome?",y:"What is your name? → is."}
 ]
},
{
 id:"hb", t:"Have o be?", s:"Ho freddo = I'm cold",
 ask:"Have got oppure be?",
 rule:`<p>In italiano diciamo «ho» anche quando l'inglese usa <b>be</b>.</p>
 <table class="tb"><tr><th>Italiano</th><th>Inglese (be)</th></tr>
 <tr><td>ho 14 anni</td><td>I'm 14</td></tr><tr><td>ho freddo / caldo</td><td>I'm cold / hot</td></tr>
 <tr><td>ho fame / sete</td><td>I'm hungry / thirsty</td></tr><tr><td>ho paura</td><td>I'm afraid / scared</td></tr>
 <tr><td>ho ragione / torto</td><td>I'm right / wrong</td></tr><tr><td>ho fretta</td><td>I'm in a hurry</td></tr>
 <tr><td>ho sonno</td><td>I'm sleepy</td></tr></table>
 <p><b>Have got</b> invece per cose che hai, famiglia, aspetto, malattie: I've got a dog, a brother, brown eyes, a cold (il raffreddore), a headache (mal di testa).</p>`,
 ex:[["I'm cold.","Ho freddo."],["I've got a cold.","Ho il raffreddore."],["How old are you? I'm fourteen.","Quanti anni hai? Ne ho quattordici."]],
 trap:"I'm cold = ho freddo. I've got a cold = ho il raffreddore.",
 pr:[["hungry","«hangri»"],["thirsty","«thöösti»: soffio con la lingua tra i denti"],["afraid","«afreid»"]],
 qs:[
  {q:"I ___ fourteen. (ho 14 anni)",w:["am","'m"],h:"L'età si dice con to be.",y:"Età → be: I am fourteen."},
  {q:"Ho fame = I ___ hungry.",m:["am","have got"],a:0,h:"Fame è una sensazione.",y:"Sensazioni → be: I'm hungry."},
  {q:"Michael ___ a cold.",m:["is","has got"],a:1,h:"A cold qui è il raffreddore.",y:"Malattie → have got."},
  {q:"We ___ cold.",m:["are","have got"],a:0,h:"Qui cold è il freddo che sentiamo.",y:"Sensazione → be: we're cold."},
  {q:"She ___ short curly hair.",m:["is","has got"],a:1,h:"Aspetto fisico.",y:"Aspetto fisico → has got."},
  {q:"Ho paura dei ragni = I ___ afraid of spiders.",m:["am","have got"],a:0,h:"La paura è una sensazione.",y:"Ho paura → I'm afraid."},
  {q:"My brother ___ a headache.",m:["is","has got"],a:1,h:"Headache = mal di testa.",y:"Malattie e dolori → has got."},
  {q:"Hai ragione! = You ___ right!",m:["are","have got"],a:0,h:"Avere ragione si dice con to be.",y:"Ho ragione → I'm right."},
  {q:"Ho sete = I ___ thirsty.",w:["am","'m"],h:"Sensazione.",y:"Ho sete → I'm thirsty."},
  {q:"Ho fretta = I ___ in a hurry.",w:["am","'m"],h:"Si dice con to be.",y:"Ho fretta → I'm in a hurry."},
  {q:"Ho un gatto = I ___ a cat.",w:["have got","'ve got"],h:"Una cosa che possiedi: due parole.",y:"Possesso → have got."},
  {q:"Quanti anni hai? = How old ___ you?",m:["are","have"],a:0,h:"L'età si dice con to be.",y:"How old are you?"}
 ]
},
{
 id:"tags", t:"Domandine e anche io", s:"question tags, so / neither",
 ask:"Completa la domandina o la risposta.",
 rule:`<p><b>Question tag</b> = la domandina in fondo, come «vero?», «no?».</p>
 <table class="tb"><tr><th>Frase</th><th>Domandina</th></tr>
 <tr><td>affermativa</td><td><b>negativa</b>: You've got a guitar, <b>haven't you</b>?</td></tr>
 <tr><td>negativa</td><td><b>affermativa</b>: He hasn't got a job, <b>has he</b>?</td></tr></table>
 <p>Nella domandina usa lo stesso verbo della frase e un pronome (she, he, they…). Con to be: She's nice, <b>isn't she</b>?</p>
 <div class="box"><span class="lab">So e neither</span><b>So</b> = anche. <b>Neither</b> = neanche. Dopo metti il verbo (have, has, am, is, are) e poi il soggetto.<br>I've got a dog. — <b>So have I</b>.<br>I haven't got a car. — <b>Neither have I</b>. (dopo neither il verbo è affermativo)</div>`,
 ex:[["You've got a guitar, haven't you?","Hai una chitarra, vero?"],["David hasn't got a job, has he?","David non ha un lavoro, vero?"],["I'm hungry. So am I.","Ho fame. Anche io."],["I haven't got a car. Neither have I.","Non ho la macchina. Neanche io."]],
 trap:"Dopo neither il verbo è affermativo: Neither have I, mai «Neither haven't I».",
 pr:[["neither","«naidha» in inglese britannico, «niidha» in americano"],["haven't you","«hévnciu»: le parole si attaccano"]],
 qs:[
  {q:"They've got a very large flat, ___?",w:["haven't they"],h:"Frase affermativa → domandina negativa. Verbo + pronome.",y:"Affermativa con have → haven't they?"},
  {q:"She's got a violin, ___?",w:["hasn't she"],h:"She's got = she has got. Domandina negativa.",y:"Has → hasn't she?"},
  {q:"David hasn't got a job, ___?",w:["has he"],h:"Frase negativa → domandina affermativa.",y:"Negativa → has he?"},
  {q:"You're tired, ___?",w:["aren't you"],h:"You're = you are. Domandina negativa.",y:"Are → aren't you?"},
  {q:"It isn't cold, ___?",w:["is it"],h:"Frase negativa → domandina affermativa.",y:"Isn't → is it?"},
  {q:"A: I've got a cat. B: So ___ I.",w:["have"],h:"Usa lo stesso verbo della prima frase.",y:"I've got → So have I."},
  {q:"A: Tom has got a temperature. B: So ___ Bill.",w:["has"],h:"Bill = he.",y:"Has → So has Bill."},
  {q:"A: I haven't got a saxophone. B: Neither ___ I.",w:["have"],h:"Dopo neither il verbo è affermativo.",y:"Neither have I."},
  {q:"A: I'm hungry. B: So ___ I.",w:["am"],h:"I'm = I am.",y:"So am I."},
  {q:"A: She isn't at school. B: Neither ___ Marco.",w:["is"],h:"Marco = he. Verbo affermativo.",y:"Neither is Marco."},
  {q:"A: We haven't got a car. B: ___ have we.",m:["So","Neither"],a:1,h:"La prima frase è negativa.",y:"Negativa → Neither have we."},
  {q:"Your mum is a doctor, ___?",m:["isn't she","is she","hasn't she"],a:0,h:"Frase affermativa con is.",y:"Is → isn't she?"}
 ]
},

{

 ]

{
 id:"rev", t:"Ripasso: be e have got", s:"il dialogo di Bob e Susan",
 ask:"Completa con be o have got. Usa la forma contratta quando puoi.",
 rule:`<table class="tb"><tr><th>Be (essere)</th><th>Have got (avere)</th></tr>
 <tr><td>I'm / you're / he's / it's / we're / they're</td><td>I've got / you've got / he's got / it's got / they've got</td></tr>
 <tr><td>negativa: isn't / aren't / I'm not</td><td>negativa: haven't got / hasn't got</td></tr>
 <tr><td>domanda: Is it…? Are you…?</td><td>domanda: Has it got…? Have they got…?</td></tr>
 <tr><td>interrogativo-negativa: Isn't it…? Aren't you…?</td><td>interrogativo-negativa: Hasn't she got…? Haven't you got…?</td></tr></table>
 <div class="box"><span class="lab">Trucco</span>C'è got nella frase o una cosa che si possiede? → <b>have</b>. Si parla di come è qualcosa, dove si trova, età, freddo, paura? → <b>be</b>.</div>
 <p>L'<b>interrogativo-negativa</b> è la domanda con not: <b>Aren't</b> you afraid of dogs? = Non hai paura dei cani?</p>`,
 ex:[["I'm cold now.","Ho freddo adesso."],["It's got nine rooms.","Ha nove stanze."],["Aren't you afraid of dogs?","Non hai paura dei cani?"],["Is there central heating?","C'è il riscaldamento?"]],
 trap:"It's può essere it is (It's big) oppure it has (It's got a garden). Guarda se dopo c'è got.",
 pr:[["aren't you","«aanciu»"],["hasn't she","«hezntscii»"]],
 qs:[
  {q:"I haven't got a coat with me and I ___ cold now.",w:["'m","am"],h:"Ho freddo = sono freddo.",y:"I'm cold."},
  {q:"I hope it ___ very cold in the mountains today. (negativo)",w:["isn't","is not","'s not"],h:"Il tempo si dice con be.",y:"It isn't cold."},
  {q:"___ there central heating in their house?",w:["is"],h:"C'è…? in una domanda.",y:"Is there…?"},
  {q:"Of course there ___.",w:["is"],h:"Risposta: c'è.",y:"There is."},
  {q:"It ___ a very comfortable house.",w:["'s","is"],h:"Descrive com'è la casa.",y:"It's a comfortable house."},
  {q:"___ it got a garden?",w:["has"],h:"Dopo c'è got.",y:"Has it got…?"},
  {q:"Yes, it ___.",w:["has"],h:"Risposta breve a «Has it got», senza got.",y:"Yes, it has."},
  {q:"It ___ very big, but it's nice. (negativo)",w:["isn't","is not","'s not"],h:"Descrive com'è.",y:"It isn't very big."},
  {q:"___ it a big house?",w:["is"],h:"Domanda su com'è.",y:"Is it a big house?"},
  {q:"It ___ nine rooms altogether.",w:["'s got","has got"],h:"Possesso: due parole.",y:"It's got / has got nine rooms."},
  {q:"Wow! ___ it really got nine rooms?",w:["has"],h:"Dopo c'è got.",y:"Has it really got…?"},
  {q:"They ___ a big family. (hanno)",w:["'ve got","have got"],h:"Avere una famiglia: due parole.",y:"They've got a big family."},
  {q:"How many children ___ they got?",w:["have"],h:"Domanda con they.",y:"How many children have they got?"},
  {q:"___ you afraid of dogs? (Non hai paura…?)",w:["aren't"],h:"Domanda con be e con la negazione.",y:"Interrogativo-negativa: Aren't you…?"},
  {q:"No, I ___.",w:["'m not","am not"],h:"Risposta breve negativa con be.",y:"No, I'm not."},
  {q:"___ Claire got anybody to help her?",w:["has"],h:"Dopo c'è got, Claire = she.",y:"Has Claire got…?"},
  {q:"No, she ___.",w:["hasn't","has not"],h:"Risposta breve negativa con have.",y:"No, she hasn't."},
  {q:"Well, here we ___.",w:["are"],h:"We + be.",y:"Here we are = eccoci."},
  {q:"Mary's got ___ hair.",m:["straight","slim"],a:0,h:"Slim si usa per il corpo.",y:"Straight hair = capelli lisci. Slim = magra."},
  {q:"Melina is ___.",m:["Greek","Grecian"],a:0,h:"La nazionalità.",y:"Greca = Greek."},
  {q:"My sister ___ got a mobile phone.",m:["hasn't","haven't"],a:0,h:"My sister = she.",y:"She → hasn't."},
  {q:"Is ___ bag yours?",m:["this","these"],a:0,h:"Bag è singolare.",y:"Singolare → this."},
  {q:"The plural of 'lady' is ___.",m:["ladies","ladyes"],a:0,h:"Consonante + y.",y:"Consonante + y → -ies."},
  {q:"We use ___ to talk about plurals.",m:["there are","there is"],a:0,h:"Plurale.",y:"There are per il plurale."},
  {q:"We say 'I ___ fourteen years old.'",m:["am","have"],a:0,h:"L'età si dice con be.",y:"I am fourteen."}
 ]
},
{
 id:"dial", t:"Dialoghi: cosa viene dopo?", s:"capire la domanda e rispondere",
 ask:"Leggi il dialogo e scegli la battuta che viene dopo.",
 rule:`<p>Nei mini-dialoghi la prima cosa da fare è capire <b>che cosa ti chiede</b> la battuta prima.</p>
 <table class="tb"><tr><th>Se senti…</th><th>Ti chiede…</th><th>Rispondi con…</th></tr>
 <tr><td>Can I help you? / What would you like?</td><td>cosa vuoi</td><td>I'd like some…, please.</td></tr>
 <tr><td>How many…? / How much…?</td><td>quanti / quanto</td><td>un numero o una quantità: Two kilos. Half a kilo.</td></tr>
 <tr><td>How much is that?</td><td>il prezzo</td><td>£4.30, please.</td></tr>
 <tr><td>Would you like…?</td><td>un'offerta</td><td>Yes, please. / No, thanks.</td></tr>
 <tr><td>Anything else?</td><td>se vuoi altro</td><td>I'd like… too. / No, that's all.</td></tr>
 <tr><td>Is that all?</td><td>se hai finito</td><td>Yes, that's all.</td></tr>
 <tr><td>Have you got…? / Is it…?</td><td>sì o no</td><td>risposta breve con lo stesso verbo: Yes, I have. / No, it isn't.</td></tr>
 <tr><td>…, isn't it?</td><td>se sei d'accordo</td><td>Yes, it is. / Yes, beautiful.</td></tr></table>
 <div class="box"><span class="lab">Trucco</span>Cerca il <b>verbo</b> della domanda e riusalo nella risposta: <b>Has</b> she got…? → Yes, she <b>has</b>. <b>Are</b> you…? → No, I'm <b>not</b>.</div>`,

  {ctx:["M: Good morning. Can I help you?"],q:"E: ___",m:["Yes, I'd like some fruit, please.","How much is that?","Goodbye."],a:0,h:"Ti offre aiuto: di' cosa vuoi.",y:"Can I help you? → di' cosa vuoi comprare."},
  {ctx:["M: What would you like, madam?"],q:"E: ___",m:["I'd like some oranges, please.","Two kilos.","Yes, that's all."],a:0,h:"What = che cosa.",y:"What would you like? chiede che cosa vuoi."},

  {ctx:["M: Anything else?"],q:"E: ___",m:["I'd like some strawberries, too.","Two kilos.","Goodbye."],a:0,h:"Anything else? = Altro?",y:"Anything else? → aggiungi un'altra cosa."},
  {ctx:["M: How many strawberries would you like?"],q:"E: ___",m:["Half a kilo, please.","Yes, please.","They're mine."],a:0,h:"Chiede quante.",y:"How many → Half a kilo."},
  {ctx:["M: We've got some very good cherries. Would you like some cherries too?"],q:"E: ___",m:["No, thanks. No cherries. We've got some.","Half a kilo of oranges.","How much is that?"],a:0,h:"Would you like è un'offerta.",y:"A un'offerta: Yes, please / No, thanks."},

  {ctx:["E: How much is that?"],q:"M: ___",m:["£4.30, please.","Two kilos.","Yes, it is."],a:0,h:"How much is that? chiede il prezzo.",y:"Prezzo → £4.30."},
  {ctx:["M: £4.30, please. Lovely day, isn't it?"],q:"E: ___",m:["Yes, beautiful. Thank you very much. Goodbye.","No, thanks.","Two kilos."],a:0,h:"Isn't it? chiede se sei d'accordo.",y:"Lovely day, isn't it? → Yes, beautiful."},
  {ctx:["A: Has she got any cousins?"],q:"B: ___",m:["Yes, she has.","Yes, she is.","Yes, she's got."],a:0,h:"Il verbo della domanda è has.",y:"Has she got…? → Yes, she has."},

  {ctx:["A: Have you got much free time?"],q:"B: ___",m:["No, I haven't. I've got a lot of homework.","No, I'm not.","Yes, I'm."],a:0,h:"Il verbo della domanda è have.",y:"Have you got…? → No, I haven't."},

function norm(s){
  return String(s).toLowerCase().replace(/[’‘`´]/g,"'").replace(/\s+/g," ").trim().replace(/[.!?,;:]+$/,"").trim();
}
function cmp(s){return norm(s).replace(/^'+/,"");}
function inVocab(v){

}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

let VOICE=null;
const BAD=/albert|bad news|bahh|bells|boing|bubbles|cellos|deranged|good news|hysterical|jester|organ|superstar|trinoids|whisper|wobble|zarvox|fred|junior|ralph|kathy|princess|grandma|grandpa|eddy|flo\b|reed|rocko|sandy|shelley|novelty/i;
function pickVoice(){
  if(!("speechSynthesis" in window)) return null;
  const vs=speechSynthesis.getVoices().filter(v=>/^en([-_]|$)/i.test(v.lang)&&!BAD.test(v.name));
  if(!vs.length) return null;
  const sc=v=>{let s=0;
    if(/premium|enhanced|natural|neural|avanzat|migliorat/i.test(v.name)) s+=5;
    if(/en[-_]gb/i.test(v.lang)) s+=3;
    if(/daniel|serena|kate|arthur|martha|libby|sonia|ryan|google uk english/i.test(v.name)) s+=3;
    if(/samantha|ava|allison|google us english|joelle|nathan/i.test(v.name)) s+=2;
    if(/en[-_](us|au|ie)/i.test(v.lang)) s+=1;
    return s;};
  return vs.sort((a,b)=>sc(b)-sc(a))[0];
}
function initVoice(){const v=pickVoice(); if(v){VOICE=v;document.body.classList.remove("novoice");}}
if("speechSynthesis" in window){initVoice();speechSynthesis.onvoiceschanged=initVoice;setTimeout(initVoice,600);setTimeout(initVoice,1800);}
function say(t){
  if(!VOICE) return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.voice=VOICE;u.lang=VOICE.lang;u.rate=S.slow?0.62:0.9;speechSynthesis.speak(u);}catch(e){}
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-say]");if(b){e.preventDefault();say(b.dataset.say);}});

/* frase completa da leggere ad alta voce */
function answerText(q){return q.df?"vedi il dialogo completo":q.m?q.m[q.a]:q.w[0];}
function spoken(q){
  if(q.df) return dfSpeech(q);
  if(q.noSay) return "";
  if(q.o) return q.w[0];
  if(q.ctx) return answerText(q);
  if(q.tp!=="s"&&!q.q.includes("___")) return q.q;
  return fullSentence(q);
}
function shown(q){
  if(q.df) return "Dialogo «"+q.q+"»";
  if(q.ctx) return q.ctx[q.ctx.length-1]+" → "+answerText(q);
  if(q.o) return q.w[0];
  if(q.noSay||(q.tp!=="s"&&!q.q.includes("___"))) return q.q.replace("___","…")+" → "+answerText(q);
  return fullSentence(q);
}
function fullSentence(q){
  let s=q.q;
  if(q.tp==="s") return s;
  s=s.replace("___",answerText(q));
  s=s.replace(/\([^)]*\)/g,"");
  if(s.includes("=")) s=s.split("=")[1];
  s=s.replace(/\b[AB]: /g,"").replace(/\s+([?.!,])/g,"$1").replace(/\s+/g," ").trim();
  s=s.charAt(0).toUpperCase()+s.slice(1);
  return s.replace(/([.?!] )([a-z])/g,(m,a,b)=>a+b.toUpperCase());
}
function showQ(q){
  if(q.df) return `<b>${esc(q.q)}</b>`;
  const s=esc(q.q).replace("___",'<span class="gap">…</span>');
  const d=q.ctx?`<div class="dlg">${q.ctx.map(l=>`<div>${esc(l).replace(/^([A-Z]): /,"<b>$1:</b> ")}</div>`).join("")}</div>`:"";
  return d+s.replace(/^([A-Z]): /,"<b>$1:</b> ");
}

const WRONG=new Set(["amn't", "blacks", "blues", "childrens", "feets", "fishs", "foots", "hairs", "homeworks", "knifes", "knifs", "ladyes", "nices", "peoples", "persons", "pressures", "reds", "yellows", "grecian", "boys's"]);
const BLOCKTP=["cont","adj","qw"];
let ANSWERING=null;
function lookup(raw){
  let w=raw.toLowerCase().replace(/[’‘]/g,"'").replace(/^'+|'+$/g,"");
  if(!w) return null;
  if(WRONG.has(w)) return {w:raw,t:"⚠️ questa forma non esiste in inglese",wrong:true};
  if(DICT[w]) return {w:raw,t:DICT[w]};
  if(/'s$/.test(w)){const b=w.slice(0,-2);return {w:raw,t:DICT[b]?DICT[b]+" → 's = di (possesso)":"di "+b.charAt(0).toUpperCase()+b.slice(1)};}
  if(/s'$/.test(raw.toLowerCase())){const b=raw.toLowerCase().slice(0,-1);if(DICT[b])return {w:raw,t:DICT[b]+" → ' = di (possesso)"};}
  for(const [suf,rep] of [["ies","y"],["es",""],["s",""]]) if(w.endsWith(suf)&&DICT[w.slice(0,-suf.length)+rep]) return {w:raw,t:DICT[w.slice(0,-suf.length)+rep]+" (plurale)"};
  return null;
}
function wordAt(x,y){
  let node,off;
  if(document.caretRangeFromPoint){const r=document.caretRangeFromPoint(x,y);if(!r)return null;node=r.startContainer;off=r.startOffset;}
  else if(document.caretPositionFromPoint){const r=document.caretPositionFromPoint(x,y);if(!r)return null;node=r.offsetNode;off=r.offset;}
  if(!node||node.nodeType!==3) return null;
  const t=node.textContent, re=/[A-Za-z'’]/;
  let a=off,b=off; while(a>0&&re.test(t[a-1]))a--; while(b<t.length&&re.test(t[b]))b++;
  const w=t.slice(a,b).replace(/^['’]+|['’]+$/g,""); return w?{w,el:node.parentElement}:null;
}
const SKIP=".it,.ask,.qtop,.back,.lab,h2,h3,.sub,.stats,.fb b,.muted,.wpop,input,.lock";
function showWord(x,y,inAnswers){
  const hit=wordAt(x,y); if(!hit) return false;
  if(hit.el.closest(SKIP)) return false;
  const r=lookup(hit.w); if(!r) return false;
  const pop=document.getElementById("wpop");
  if(inAnswers&&ANSWERING&&(r.wrong||BLOCKTP.includes(ANSWERING))){pop.innerHTML=`<div style="flex:1"><b>${esc(hit.w)}</b><br>Prima prova a rispondere 😉 Poi te lo dico.</div>`;pop.style.display="flex";return true;}
  pop.innerHTML=`<div style="flex:1"><b>${esc(r.w)}</b><br>${esc(r.t)}</div>${r.wrong?"":sayBtn(r.w)}`;
  pop.style.display="flex"; return true;
}
document.addEventListener("click",e=>{
  const pop=document.getElementById("wpop");
  if(e.target.closest("#wpop")) return;
  if(pop.style.display==="flex"){pop.style.display="none";}
  if(e.target.closest("button,a,input,.opt,.tw,.slot,.bank")) return;
  showWord(e.clientX,e.clientY,false);
},true);
let LP=null,LPdone=false;
document.addEventListener("touchstart",e=>{
  const b=e.target.closest(".opt,.tw,.bank button,.slot"); if(!b) return;
  const t=e.touches[0]; LPdone=false;
  LP=setTimeout(()=>{LPdone=showWord(t.clientX,t.clientY,!!e.target.closest(".opts,.tiles,.built,.bank,.slot"));},550);
},{passive:true});
["touchend","touchmove","touchcancel"].forEach(ev=>document.addEventListener(ev,()=>clearTimeout(LP),{passive:true}));
document.addEventListener("click",e=>{if(LPdone){e.stopPropagation();e.preventDefault();LPdone=false;}},true);
document.addEventListener("contextmenu",e=>{if(e.target.closest(".opt,.tw,.bank button,.slot")){e.preventDefault();showWord(e.clientX,e.clientY,!!e.target.closest(".opts,.tiles,.built,.bank,.slot"));}});

/* ---------- accesso con codice ---------- */
const _K=["fl","4v","1a","-e","g"].join("");
function hcode(dev){let h=2166136261;const t=dev.toUpperCase().trim()+_K;for(let i=0;i<t.length;i++){h^=t.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}return String(h%1000000).padStart(6,"0");}
function devCode(){if(!S.dev){const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let c="";for(let i=0;i<6;i++)c+=A[Math.floor(Math.random()*A.length)];S.dev=c;save();}return S.dev;}
function lockScreen(){
  hdr.style.display="none";
  app.innerHTML=`<div class="lock card"><h2>Ciao! 👋</h2><p>Questa app è personale. Per entrare servono due passaggi:</p>
  <p style="text-align:left"><b>1.</b> Manda questo codice a chi ti ha dato l'app:</p>
  <div class="code">${devCode()}</div>
  <p style="text-align:left"><b>2.</b> Ti risponderà con un numero di 6 cifre. Scrivilo qui:</p>
  <input class="ans" id="unl" inputmode="numeric" placeholder="es. 123456" autocomplete="off" style="text-align:center">
  <div class="row" style="justify-content:center"><button class="btn" onclick="tryUnlock()">Entra</button></div><div id="fb"></div></div>`;
}
function tryUnlock(){
  const v=document.getElementById("unl").value.replace(/\D/g,"");
  if(v===hcode(devCode())){S.unl=1;save();home();}
  else document.getElementById("fb").innerHTML='<div class="fb no"><b>Codice non giusto.</b>Controlla di averlo scritto bene.</div>';
}

/* ---------- dialoghi da completare ---------- */
let DF=null;
function dfHTML(q){
  DF={order:shuffle(q.bank.map((t,k)=>k)),fill:q.lines.filter(l=>typeof l[1]==="number").map(()=>null),sel:0,locked:false};
  return `<div id="dfbox"></div>`;
}
function drawDF(){
  const q=R.queue[R.i].q, box=document.getElementById("dfbox"); if(!box) return;
  const used=DF.fill.filter(v=>v!==null);
  box.innerHTML=`<div>${q.lines.map(l=>typeof l[1]==="number"
    ?`<div class="dfl"><span class="sp">${esc(l[0])}:</span><button class="slot ${DF.fill[l[1]]!==null?"full":""} ${DF.sel===l[1]&&!DF.locked?"sel":""} ${DF.mark?DF.mark[l[1]]:""}" onclick="dfSlot(${l[1]})">${DF.fill[l[1]]!==null?esc(q.bank[DF.fill[l[1]]]):"("+(l[1]+1)+") …"}</button></div>`
    :`<div class="dfl"><span class="sp">${esc(l[0])}:</span><span>${esc(l[1])}</span></div>`).join("")}</div>
  <div class="bank">${DF.order.map(k=>`<button ${used.includes(k)||DF.locked?"disabled":""} onclick="dfPick(${k})">${esc(q.bank[k])}</button>`).join("")}</div>`;
}
function dfSlot(i){if(DF.locked)return;if(DF.fill[i]!==null){DF.fill[i]=null;}DF.sel=i;DF.mark=null;drawDF();}
function dfPick(k){if(DF.locked)return;DF.fill[DF.sel]=k;DF.mark=null;const nx=DF.fill.findIndex(v=>v===null);DF.sel=nx<0?DF.sel:nx;drawDF();}
function checkDF(){
  if(R.done) return;
  const it=R.queue[R.i], q=it.q;
  if(DF.fill.some(v=>v===null)){fb("info","<b>Completa tutti gli spazi.</b>Tocca uno spazio e poi la frase giusta.");return;}
  const ok=DF.fill.map((v,i)=>v===i);
  if(ok.every(Boolean)){DF.locked=true;DF.mark=ok.map(()=>"right");drawDF();succeed([10,6,3][R.tries]);return;}
  R.tries++; document.querySelectorAll("#tries i").forEach((d,k)=>d.classList.toggle("used",k<R.tries));
  if(R.tries>=3){DF.fill=DF.fill.map((v,i)=>i);DF.locked=true;DF.mark=DF.fill.map(()=>"right");drawDF();reveal();return;}
  DF.mark=ok.map(x=>x?"right":"wrong"); drawDF();
  fb("hint",`<b>${ok.filter(x=>!x).length} battute al posto sbagliato (in rosso).</b>Ricorda: ${esc(q.h)}`);
}

/* =========================================================
   ALLENAMENTO
   ========================================================= */
let R=null; // sessione in corso

function pickFrom(pool,n){
  const weak=shuffle(pool.filter(q=>S.weak[q.id]));
  const rest=shuffle(pool.filter(q=>!S.weak[q.id]));
  return weak.slice(0,Math.ceil(n/2)).concat(rest).concat(weak.slice(Math.ceil(n/2))).slice(0,n);
}
function startTopic(id){begin("topic",pickFrom(TBYID[id].qs,8),id);}
function compitoPool(){return ALLQ.filter(q=>COMPITO.topics.includes(q.tp));}
function smartPick(pool,n){
  const weak=shuffle(pool.filter(q=>S.weak[q.id])).slice(0,Math.ceil(n/2));
  const fresh=shuffle(pool.filter(q=>!weak.includes(q)&&!S.ok[q.id]));
  const done=shuffle(pool.filter(q=>!weak.includes(q)&&S.ok[q.id]));
  return shuffle(weak.concat(fresh,done).slice(0,n));
}
function startDaily(){
  begin("daily",smartPick(daysLeft()>=0?compitoPool():ALLQ,8));
}
function startCompito(){begin("compito",smartPick(compitoPool(),8));}
function startWeak(){
  const w=shuffle(ALLQ.filter(q=>S.weak[q.id])).slice(0,8);
  if(!w.length){topbar(false);app.innerHTML=`<button class="back" onclick="home()">‹ Indietro</button><div class="card"><h2>Nessun errore da sistemare</h2><p>Quando sbagli una domanda, finisce qui e la ritrovi finché non la azzecchi. Per ora sei a posto.</p><button class="btn" onclick="startDaily()">Fai l'allenamento di oggi</button></div>`;return;}
  begin("weak",w);
}
function begin(mode,qs,topic){
  R={mode,topic,queue:qs.map(q=>({q,again:false})),i:0,pts:0,max:qs.length*10,log:[]};
  if(mode==="scheda") R.scheda=SCHEDE.indexOf(topic)+1;
  renderQ();
}

function renderQ(){
  topbar(false); closeSheet();
  const it=R.queue[R.i], q=it.q, tp=TBYID[q.tp];
  R.tries=0; R.seen=new Set(); R.done=false;
  const total=R.queue.length;
  app.innerHTML=`<button class="back" onclick="quitAsk()">‹ Esci</button>
  <div class="qtop"><span>${R.i+1} / ${total}</span><span>⭐ ${R.pts}</span></div>
  <div class="prog"><i style="width:${(R.i/total)*100}%"></i></div>
  <div class="card">
    <div class="qtop"><span>${R.mode==="scheda"?`Scheda ${R.scheda} · Esercizio ${q.n}`:tp.t}</span>${it.again?'<span>torna per ripasso</span>':""}</div>
    <p class="ask">${esc(q.ask||tp.ask)}</p>
    ${exBox(q)}
    <div class="q">${showQ(q)}</div>
    ${q.df?`${dfHTML(q)}<div class="row"><button class="btn" id="chk" onclick="checkDF()">Controlla</button></div><div class="tries" id="tries"><i></i><i></i><i></i></div>`
      :q.m?`<div class="opts">${shuffle(q.m.map((o,k)=>[o,k])).map(([o,k])=>`<button class="opt" data-k="${k}" onclick="pickOpt(${k})">${esc(o)}</button>`).join("")}</div>`
      :q.o?`${tilesHTML(q)}<div class="row"><button class="btn" id="chk" onclick="checkW(tilesValue(),true)">Controlla</button></div><div class="tries" id="tries"><i></i><i></i><i></i></div>`
      :`<input class="ans" id="ans" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Scrivi qui" enterkeyhint="done">
        <div class="row"><button class="btn" id="chk" onclick="checkW()">Controlla</button></div>
        <div class="tries" id="tries"><i></i><i></i><i></i></div>`}
    <div id="fb"></div>
    <div class="row" style="justify-content:space-between;align-items:center"><button class="link" onclick="openSheet('${q.tp}')">Rivedi la regola</button><span id="next"></span></div>
  </div>`;
  const inp=document.getElementById("ans");
  if(inp){inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();checkW();}});setTimeout(()=>inp.focus(),80);}
  if(q.o) drawTiles();
  if(q.df) drawDF();
  ANSWERING=q.tp;
}
function fb(cls,html){document.getElementById("fb").innerHTML=`<div class="fb ${cls}">${html}</div>`;}
function hint2(q){
  const a=q.w[0];
  const first=a[0]==="'"?a.slice(0,2):a[0];
  return `Inizia con «${esc(first)}» ed è lunga ${a.replace(/ /g,"").length} caratteri${a.includes(" ")?" (sono "+a.split(" ").length+" parole)":""}.`;
}
function checkW(val,isTiles){
  if(R.done) return;
  const it=R.queue[R.i], q=it.q, inp=document.getElementById("ans"), v=norm(isTiles?val:inp.value);
  if(isTiles&&TB.built.length<TB.words.length){fb("info","<b>Usa tutte le parole.</b>Ne mancano ancora "+(TB.words.length-TB.built.length)+".");return;}
  if(!v) return;
  if(R.seen.has(cmp(v))){fb("info","<b>Questa l'hai già provata.</b>Cambia risposta e riprova.");return;}
  if(!isTiles&&!inVocab(v)){fb("info","<b>Questa risposta non c'entra.</b>Rileggi la frase, pensa alla regola e scrivi una parola vera. Questo tentativo non conta.");return;}
  R.seen.add(cmp(v));
  if(q.w.some(a=>cmp(a)===cmp(v))){ succeed([10,6,3][R.tries]); return; }
  R.tries++;
  document.querySelectorAll("#tries i").forEach((d,k)=>d.classList.toggle("used",k<R.tries));
  if(inp) inp.select();
  if(R.tries===1) fb("hint",`<b>Non ancora.</b>Ricorda: ${esc(q.h)}`);
  else if(R.tries===2) fb("hint",`<b>Ci sei quasi.</b>Ricorda: ${esc(q.h)} ${hint2(q)}`);
  else reveal();
}
function pickOpt(k){
  if(R.done) return;
  const it=R.queue[R.i], q=it.q, b=document.querySelector(`.opt[data-k="${k}"]`);
  if(k===q.a){b.classList.add("right");succeed(R.tries===0?10:4);return;}
  R.tries++; b.classList.add("wrong"); b.disabled=true;
  const left=document.querySelectorAll(".opt:not(:disabled)").length;
  if(left<=1||R.tries>=2) reveal();
  else fb("hint",`<b>Non ancora.</b>Ricorda: ${esc(q.h)}`);
}
function lock(){R.done=true;ANSWERING=null;if(TB)TB.locked=true;document.querySelectorAll(".tw").forEach(b=>b.disabled=true);document.querySelectorAll(".opt").forEach(b=>b.disabled=true);const i=document.getElementById("ans");if(i)i.disabled=true;const c=document.getElementById("chk");if(c)c.style.display="none";}
function succeed(p){
  const it=R.queue[R.i], q=it.q; lock();
  if(q.m) document.querySelector(`.opt[data-k="${q.a}"]`).classList.add("right");
  const gained=it.again?0:p; R.pts+=gained;
  if(S.weak[q.id]){S.weak[q.id]--; if(S.weak[q.id]<=0) delete S.weak[q.id];}
  if(R.tries<=1) S.ok[q.id]=1;
  save();
  if(R.tries>0||it.again) R.log.push({q,ok:true});
  const praise=["Giusto!","Perfetto!","Esatto!","Brava!"][Math.floor(Math.random()*4)];
  fb("ok",`<b>${praise}${gained?" +"+gained:""}</b>${esc(q.y)}<div class="row">${sayBtn(spoken(q),"Ascolta la frase")}</div>`);
  nextBtn();
}
function reveal(){
  const it=R.queue[R.i], q=it.q; lock();
  if(q.m) document.querySelector(`.opt[data-k="${q.a}"]`).classList.add("right");
  S.weak[q.id]=(S.weak[q.id]||0)+2; delete S.ok[q.id]; save();
  R.log.push({q,ok:false});
  if(!it.again) R.queue.push({q,again:true});
  fb("no",`<b>La risposta giusta è: ${esc(answerText(q))}</b>${esc(q.y)}<br><small>Questa domanda torna alla fine, così la rifai.</small><div class="row">${sayBtn(spoken(q),"Ascolta la frase")}</div>`);
  nextBtn();
}
function nextBtn(){document.getElementById("next").innerHTML=`<button class="btn" onclick="nextQ()">Avanti ›</button>`;}
function nextQ(){
  if(R.mode==="scheda"&&!R.queue[R.i].again){S.sres[R.topic]=R.queue[R.i].q.n%TBYID[R.topic].qs.length;save();}
  R.i++; if(R.i<R.queue.length) renderQ(); else finish();
}
function quitAsk(){
  fb("info",`<b>Vuoi uscire?</b>I punti di questa partita non vengono salvati.<div class="row"><button class="btn ghost" onclick="home()">Esci</button><button class="btn" onclick="document.getElementById('fb').innerHTML=''">Continuo</button></div>`);
}
function bumpStreak(){
  const t=today(); if(S.last===t) return;
  S.streak=(S.last===yesterday())?S.streak+1:1; S.last=t;
}
function finish(){
  if(R.mode==="scheda"){S.sdone[R.topic]=1;S.sres[R.topic]=0;}
  S.pts+=R.pts; bumpStreak();
  const pct=R.pts/R.max;
  let st=pct>=.9?3:pct>=.7?2:pct>=.45?1:0;
  if((R.mode==="topic"||R.mode==="scheda")&&st>(S.stars[R.topic]||0)) S.stars[R.topic]=st;
  save(); topbar(false);
  const msg=pct>=.9?"Fantastico, questa parte la sai!":pct>=.7?"Molto bene, ancora un paio di giri e la sai.":pct>=.45?"Stai imparando: rifallo domani e vedrai la differenza.":"Rileggi la regola con calma e riprova: la seconda volta va meglio.";
  app.innerHTML=`<div class="card" style="text-align:center"><p class="muted" style="margin:0">Hai fatto</p><div class="score">${R.pts}</div><p class="muted" style="margin:0 0 6px">punti su ${R.max}</p>
  ${R.mode==="topic"?`<div class="stars" style="font-size:28px;margin:0">${stars(st)}</div>`:""}<p>${msg}</p></div>
  ${R.log.length?`<div class="card"><h3 style="margin-top:0">Da ricordare</h3>${R.log.filter((l,k,a)=>!l.ok&&a.findIndex(x=>!x.ok&&x.q.id===l.q.id)===k).map(l=>`<div class="res"><b>${esc(shown(l.q))}</b><br><span class="muted">${esc(l.q.y)}</span></div>`).join("")||'<p class="muted">Hai recuperato tutti gli errori. Ottimo.</p>'}</div>`:""}
  <div class="row"><button class="btn" onclick="${R.mode==="topic"?`startTopic('${R.topic}')`:R.mode==="weak"?"startWeak()":R.mode==="compito"?"startCompito()":R.mode==="scheda"?"schedePage()":"startDaily()"}">${R.mode==="scheda"?"Torna alle schede":"Ancora una"}</button><button class="btn ghost" onclick="home()">Home</button></div>`;
}

/* =========================================================
   CANZONI
   ========================================================= */
let G=null;
function songIntro(){
  topbar(false);
  app.innerHTML=`<button class="back" onclick="home()">‹ Indietro</button><h2>Il gioco delle canzoni</h2>
  <div class="card"><p>Ti mostro il titolo di una canzone famosa con un pezzo mancante. Scegli la parola giusta usando le regole che conosci.</p>
  <p>Dopo ogni risposta puoi cercare la canzone su YouTube: ascolta il ritornello e prova a sentire il titolo cantato. Le parole nel canto si attaccano tra loro, è un ottimo allenamento per l'orecchio.</p>
  <button class="btn wide" onclick="songStart()">Gioca (8 canzoni)</button></div>`;
}
function songStart(){G={list:shuffle(SONGS).slice(0,8),i:0,pts:0};songQ();}
function songQ(){
  topbar(false);
  const s=G.list[G.i]; G.tries=0; G.done=false;
  app.innerHTML=`<button class="back" onclick="home()">‹ Esci</button>
  <div class="qtop"><span>${G.i+1} / ${G.list.length}</span><span>⭐ ${G.pts}</span></div>
  <div class="prog"><i style="width:${(G.i/G.list.length)*100}%"></i></div>
  <div class="card song"><p class="ask">Completa il titolo</p>
  <div class="ttl">${esc(s.q).replace("___",'<span class="gap">…</span>')}</div><div class="by">${esc(s.by)}</div>
  <div class="opts">${shuffle(s.m.map((o,k)=>[o,k])).map(([o,k])=>`<button class="opt" data-k="${k}" onclick="songPick(${k})">${esc(o)}</button>`).join("")}</div>
  <div id="fb"></div><div class="row" style="justify-content:flex-end"><span id="next"></span></div></div>`;
}
function songPick(k){
  if(G.done) return;
  const s=G.list[G.i], b=document.querySelector(`.opt[data-k="${k}"]`);
  if(k!==s.a){
    G.tries++; b.classList.add("wrong"); b.disabled=true;
    if(document.querySelectorAll(".opt:not(:disabled)").length>1){fb("hint","<b>Non ancora.</b>Pensa alla regola e riprova.");return;}
  }
  G.done=true; document.querySelectorAll(".opt").forEach(x=>x.disabled=true);
  document.querySelector(`.opt[data-k="${s.a}"]`).classList.add("right");
  const ins=/'___/.test(s.q)?s.m[s.a]:s.m[s.a].charAt(0).toUpperCase()+s.m[s.a].slice(1); const title=s.q.replace("___",ins); const p=G.tries===0?10:G.tries===1?4:0; G.pts+=p;
  const url="https://www.youtube.com/results?search_query="+encodeURIComponent(title+" "+s.by.replace(/^dal film /,""));
  fb(p?"ok":"no",`<b>${p?"Giusto! +"+p:"Era: "+esc(s.m[s.a])}</b>«${esc(title)}». ${esc(s.y)}<div class="row">${sayBtn(title,"Ascolta il titolo")}</div><a class="yt" href="${url}" target="_blank" rel="noopener">Cerca la canzone su YouTube ›</a>`);
  document.getElementById("next").innerHTML=`<button class="btn" onclick="G.i++;G.i<G.list.length?songQ():songEnd()">Avanti ›</button>`;
}
function songEnd(){
  S.pts+=G.pts; bumpStreak(); save(); topbar(false);
  app.innerHTML=`<div class="card" style="text-align:center"><p class="muted" style="margin:0">Canzoni</p><div class="score">${G.pts}</div><p class="muted">punti su ${G.list.length*10}</p></div>
  <div class="row"><button class="btn" onclick="songStart()">Altre canzoni</button><button class="btn ghost" onclick="home()">Home</button></div>`;
}

/* =========================================================
   PROVA DI VERIFICA
   ========================================================= */
let T=null, testSel=new Set(TOPICS.map(t=>t.id));
function testSetup(){
  topbar(false);
  app.innerHTML=`<button class="back" onclick="home()">‹ Indietro</button><h2>Prova di verifica</h2>
  <div class="card"><p>12 domande, come in classe: niente aiuti e un solo tentativo. Alla fine vedi la correzione con il perché di ogni risposta.</p>
  <p class="muted" style="margin-bottom:0">Scegli gli argomenti della verifica:</p>
  <div class="chips">${TOPICS.map(t=>`<button class="chip ${testSel.has(t.id)?"on":""}" onclick="toggleSel('${t.id}',this)">${t.t}</button>`).join("")}</div>
  <button class="btn wide" onclick="testStart()">Inizia la prova</button></div>`;
}
function toggleSel(id,el){testSel.has(id)?testSel.delete(id):testSel.add(id);el.classList.toggle("on");}
function testStart(){
  if(!testSel.size){alertBox("Scegli almeno un argomento.");return;}
  const pool=ALLQ.filter(q=>testSel.has(q.tp)&&!q.df);
  T={qs:shuffle(pool).slice(0,12),i:0,ans:[],scope:"libera"};
  testQ();
}
function testCompito(){
  const pool=compitoPool().filter(q=>!q.df), by={};
  pool.forEach(q=>(by[q.tp]=by[q.tp]||[]).push(q));
  let qs=[]; Object.values(by).forEach(a=>qs.push(shuffle(a)[0]));
  qs=shuffle(qs).slice(0,15);
  T={qs,i:0,ans:[],scope:"compito"};
  testQ();
}
function alertBox(t){const d=document.createElement("div");d.className="fb hint";d.textContent=t;app.querySelector(".card").appendChild(d);setTimeout(()=>d.remove(),2500);}
function testQ(){
  topbar(false);
  const q=T.qs[T.i], tp=TBYID[q.tp];
  app.innerHTML=`<div class="qtop"><span>Domanda ${T.i+1} di ${T.qs.length}</span><span>Verifica</span></div>
  <div class="prog"><i style="width:${(T.i/T.qs.length)*100}%"></i></div>
  <div class="card"><p class="ask">${esc(q.ask||tp.ask)}</p>${exBox(q)}<div class="q">${showQ(q)}</div>
  ${q.m?`<div class="opts">${shuffle(q.m.map((o,k)=>[o,k])).map(([o,k])=>`<button class="opt" onclick="testAns(${k})">${esc(o)}</button>`).join("")}</div>`
   :q.o?`${tilesHTML(q)}<div class="row"><button class="btn" onclick="testAns()">Avanti ›</button></div>`
   :`<input class="ans" id="ans" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Scrivi qui" enterkeyhint="done"><div class="row"><button class="btn" onclick="testAns()">Avanti ›</button></div>`}
  </div>`;
  const inp=document.getElementById("ans");
  if(inp){inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();testAns();}});setTimeout(()=>inp.focus(),80);}
  if(q.o) drawTiles();
  ANSWERING=q.tp;
}
function testAns(k){
  const q=T.qs[T.i]; let given, ok;
  if(q.m){given=q.m[k]; ok=k===q.a;}
  else if(q.o){if(TB.built.length<TB.words.length) return; given=tilesValue(); ok=q.w.some(a=>cmp(a)===cmp(given));}
  else{given=document.getElementById("ans").value.trim(); if(!given) return; ok=q.w.some(a=>cmp(a)===cmp(given));}
  T.ans.push({q,given,ok});
  T.i++; T.i<T.qs.length?testQ():testEnd();
}
function testEnd(){
  const ok=T.ans.filter(a=>a.ok).length, n=T.ans.length;
  T.ans.forEach(a=>{if(!a.ok){S.weak[a.q.id]=(S.weak[a.q.id]||0)+2;delete S.ok[a.q.id];}else S.ok[a.q.id]=1;});
  S.tests.push({d:today(),ok,n,scope:T.scope}); S.tests=S.tests.slice(-20);
  bumpStreak(); save(); topbar(false);
  const msg=ok===n?"Tutte giuste, bravissima!":ok/n>=.7?"Molto bene! Guarda la correzione qui sotto: ti mancano pochi dettagli.":"Ogni prova ti allena. Le domande sbagliate sono in «I miei errori»: sistemale con calma e poi rifai la prova.";
  app.innerHTML=`<div class="card" style="text-align:center"><p class="muted" style="margin:0">Risposte giuste</p><div class="score">${ok}</div><p class="muted" style="margin:0">su ${n} domande</p><p>${msg}</p></div>
  <div class="card"><h3 style="margin-top:0">Correzione</h3>${T.ans.map(a=>`<div class="res">${a.ok?"✅":"❌"} <b>${esc(shown(a.q))}</b>${a.ok?"":`<br><span class="muted">Hai risposto: «${esc(a.given)}». ${esc(a.q.y)}</span>`}</div>`).join("")}</div>
  <div class="row"><button class="btn" onclick="${T.scope==="compito"?"testCompito()":"testSetup()"}">Rifai la prova</button><button class="btn ghost" onclick="startWeak()">Sistema gli errori</button><button class="btn ghost" onclick="home()">Home</button></div>`;
}

/* =========================================================
   PRONUNCIA
   ========================================================= */
function pronPage(){
  topbar(false);
  app.innerHTML=`<button class="back" onclick="home()">‹ Indietro</button><h2>I trucchi della pronuncia</h2>
  <p class="muted">Le parole tra «» sono un aiuto per leggere: il suono vero lo senti con Ascolta.</p>
  ${PRON_TIPS.map(p=>`<div class="card"><h3 style="margin-top:0">${esc(p.t)}</h3><p>${esc(p.d)}</p><div class="row">${p.w.map(w=>sayBtn(w,esc(w))).join("")}</div></div>`).join("")}`;
}

home();
</script>
